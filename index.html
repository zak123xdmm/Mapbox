<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mapbox con Geocerca Actualizada</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #map { 
      width: 100%; 
      height: 100vh; 
    }

    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.65);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: white;
      padding: 18px 25px;
      border-radius: 18px;
      z-index: 1;
      min-width: 280px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }

    #info h3 {
      margin: 0 0 12px 0;
      font-weight: 600;
      font-size: 18px;
      text-align: center;
      letter-spacing: 1px;
      color: #00E0FF;
      transition: color 0.3s ease;
    }

    #info.fuera-geocerca {
      background: rgba(139, 0, 0, 0.8);
      border: 1px solid rgba(255, 0, 0, 0.4);
    }
    #info.fuera-geocerca h3 {
      color: #FF4D4D;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 14px;
    }

    .label {
      opacity: 0.7;
    }

    .value {
      font-weight: bold;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div id="info">
  <h3 id="estado-titulo">Ubicación en Tiempo Real</h3>

  <div class="info-item">
    <span class="label">Latitud:</span>
    <span class="value" id="latitud">--</span>
  </div>

  <div class="info-item">
    <span class="label">Longitud:</span>
    <span class="value" id="longitud">--</span>
  </div>

  <div class="info-item">
    <span class="label">Estado:</span>
    <span class="value" id="geocerca-status">Calculando...</span>
  </div>

  <div class="info-item">
    <span class="label">Última actualización:</span>
    <span class="value" id="hora">--</span>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV9fZDl26hfyPDSZd6Mxw7bBATHVYGB6Y",
  authDomain: "programacionmovilmapbox.firebaseapp.com",
  databaseURL: "https://programacionmovilmapbox-default-rtdb.firebaseio.com/",
  projectId: "programacionmovilmapbox",
  storageBucket: "programacionmovilmapbox.firebasestorage.app",
  messagingSenderId: "951654593098",
  appId: "1:951654593098:web:29b3b379e635e02e746cb3"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

mapboxgl.accessToken = "pk.eyJ1IjoiY3Jpc3RoaWFubGFpbWUiLCJhIjoiY21tOGR2eW53MHU5aDJwb2wxNXBqOXRvYyJ9.qoMU6ebmLDQUnkDI6AsAtQ";

const centroGeocerca = [-68.120051, -16.503418]; 
const radioGeocercaMetros = 100; 

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: centroGeocerca,
  zoom: 15
});

const el = document.createElement('div');
el.innerHTML = "🧍";
el.style.fontSize = "40px";
el.style.transform = "translate(-50%, -50%)";

const marker = new mapboxgl.Marker(el)
  .setLngLat(centroGeocerca)
  .addTo(map);

const infoPanel = document.getElementById('info');
const tituloPanel = document.getElementById('estado-titulo');
const latDiv = document.getElementById('latitud');
const lngDiv = document.getElementById('longitud');
const geoDiv = document.getElementById('geocerca-status');
const horaDiv = document.getElementById('hora');

map.on('load', () => {
  const centroPunto = turf.point(centroGeocerca);
  const circuloGeocerca = turf.circle(centroPunto, radioGeocercaMetros, { units: 'meters' });

  map.addSource('geocerca-source', {
    'type': 'geojson',
    'data': circuloGeocerca
  });

  map.addLayer({
    'id': 'geocerca-fill',
    'type': 'fill',
    'source': 'geocerca-source',
    'layout': {},
    'paint': {
      'fill-color': '#00E0FF',
      'fill-opacity': 0.15
    }
  });

  map.addLayer({
    'id': 'geocerca-outline',
    'type': 'line',
    'source': 'geocerca-source',
    'layout': {},
    'paint': {
      'line-color': '#00E0FF',
      'line-width': 2,
      'line-dasharray': [2, 2]
    }
  });
});

const locationRef = ref(database, "ubicacion");

onValue(locationRef, (snapshot) => {
  const data = snapshot.val();

  if (data && data.latitud && data.longitud && data.timestamp) {
    const nuevaPosicion = [data.longitud, data.latitud];

    marker.setLngLat(nuevaPosicion);
    map.flyTo({
      center: nuevaPosicion,
      speed: 1.5
    });

    latDiv.textContent = data.latitud.toFixed(6);
    lngDiv.textContent = data.longitud.toFixed(6);

    const puntoUsuario = turf.point(nuevaPosicion);
    const centroPunto = turf.point(centroGeocerca);
    
    const distanciaMetros = turf.distance(puntoUsuario, centroPunto, { units: 'meters' });

    if (distanciaMetros <= radioGeocercaMetros) {
      geoDiv.textContent = "Dentro del límite";
      geoDiv.style.color = "#00FF66";
      tituloPanel.textContent = "Ubicación en Tiempo Real";
      infoPanel.classList.remove('fuera-geocerca');
    } else {
      geoDiv.textContent = `FUERA DE LÍMITE (+${Math.round(distanciaMetros - radioGeocercaMetros)}m)`;
      geoDiv.style.color = "#FF4D4D";
      tituloPanel.textContent = "🚨 ¡ALERTA DE GEOCERCA!";
      infoPanel.classList.add('fuera-geocerca');
    }

    const date = new Date(data.timestamp);
    const opciones = { 
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    };
    horaDiv.textContent = date.toLocaleString('es-BO', opciones);
  }
});

</script>

</body>
</html>
